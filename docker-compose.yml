services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eldercare
      POSTGRES_PASSWORD: eldercare
      POSTGRES_DB: eldercare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldercare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://eldercare:eldercare@db:5432/eldercare
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
